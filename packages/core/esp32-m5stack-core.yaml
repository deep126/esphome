substitutions:
  buzzer_platform: ledc
  
esp32:
  board: $board
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

packages:
  remote_package:
    url: http://github.com/deep126/esphome
    ref: master
    refresh: 5min
    files: 
      - packages/core/default-settings.yaml
      - packages/components/i2s-audio.yaml
      - packages/components/i2s-microphone.yaml
      - packages/components/i2s-speaker.yaml
      - packages/components/voice-media-player.yaml
      - packages/components/voice-scripts.yaml
      
