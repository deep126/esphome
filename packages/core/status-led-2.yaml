light:
  - platform: status_led
    name: "Status LED Light 2"
    id: led_2
    pin:
      number: $status_led_2
      inverted: $invert_status_led

script:
  - id: blink_status_led_2
    then:
      - light.toggle: led_2
      - delay: 100ms
      - light.toggle: led_2
      - delay: 100ms
      - light.toggle: led_2
      - delay: 100ms
      - light.toggle: led_2
